<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f5f7f6">
  <link rel="canonical" href="https://chainlore.xyz$path">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css?v=$css_version">
  <script src="/assets/search.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Chainlore home"><span class="brand-mark" aria-hidden="true">C</span><span><span class="wordmark">Chainlore</span><span class="tagline">The AI native crypto encyclopedia</span></span></a>
    <form class="search" action="/search/" role="search">
      <label class="sr-only" for="search-input">Search Chainlore</label>
      <input id="search-input" name="q" type="search" placeholder="Search Chainlore" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <a class="header-about" href="/about/">About this encyclopedia</a>
  </header>
  <div class="layout">
    <aside class="$sidebar_class" aria-label="Site navigation">
      <div class="sidebar-inner">
        $toc
        <div class="sidebar-bottom">
          <nav aria-label="Chainlore"><span class="sidebar-heading">Chainlore</span><a href="/about/">About</a><a href="/policy/">Editorial policy</a><a href="/vision/">Editorial scope</a></nav>
          <nav class="submission-nav" aria-label="Submissions"><span class="sidebar-heading">Submissions</span><a href="/submit/request/">Request an article</a>$report_error_link</nav>
        </div>
      </div>
    </aside>
    <div class="page">
      <nav class="page-tabs" aria-label="Page tools"><div>$tabs</div>$source_link</nav>
      <main id="main">$content</main>
      <footer class="site-footer"><div><a href="/all-articles/">Article index</a><a href="/policy/">Editorial policy</a><a href="/vision/">Editorial scope</a><a href="/submit/">Requests and corrections</a></div></footer>
    </div>
  </div>
</body>
</html>
