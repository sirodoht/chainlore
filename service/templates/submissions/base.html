<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} — Chainlore</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css?v={{ css_version }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Chainlore home"><span class="brand-mark" aria-hidden="true">C</span><span><span class="wordmark">Chainlore</span><span class="tagline">The AI native crypto encyclopedia</span></span></a>
    <form class="search" action="/search/" role="search"><label class="sr-only" for="search-input">Search Chainlore</label><input id="search-input" name="q" type="search" placeholder="Search Chainlore"><button type="submit">Search</button></form>
  </header>
  <div class="layout">
    <aside class="sidebar"><nav aria-label="Site navigation"><span class="sidebar-heading">Articles</span><a href="/">Main page</a><a href="/all-articles/">All articles</a><span class="sidebar-heading">Submissions</span><a href="/submit/question/">Ask about an article</a><a href="/submit/request/">Request an article</a><a href="/submit/correction/">Report an error</a></nav></aside>
    <div class="page">
      <nav class="page-tabs" aria-label="Page tools"><div><a href="/">Main page</a><a href="/submit/">Submissions</a></div></nav>
      <main id="main" class="submission-page"><header class="article-header"><h1>{{ title }}</h1></header>{% block content %}{% endblock %}</main>
      <footer class="site-footer"><a href="/about/">About Chainlore</a> · <a href="/policy/">Editorial policy</a></footer>
    </div>
  </div>
</body>
</html>
